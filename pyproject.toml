[project]
name = "grab"
version = "0.1.0"
description = "A fast video downloader with a CLI and an optional web UI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "grab" }]
keywords = ["video", "downloader", "yt-dlp", "cli"]
dependencies = [
    "yt-dlp>=2024.12.13",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "static-ffmpeg>=2.7.0",
]

[project.scripts]
grab = "grab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grab"]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# B008: typer's dependency-injection style puts calls inside argument defaults.
ignore = ["B008"]
